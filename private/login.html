<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>Admin Sign In - Karthick Raja G</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script defer src="/admin/assets/login.js"></script>
  </head>
  <body data-page="login">
    <main class="auth-page">
      <section class="auth-card">
        <p class="section-kicker">Secure Admin</p>
        <h1>Sign In</h1>
        <form id="login-form" class="admin-form" method="post" action="/admin/login">
          <div class="form-field">
            <label for="username">Username</label>
            <input id="username" name="username" autocomplete="username" required autofocus>
          </div>
          <div class="form-field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
          </div>
          <button class="button button-primary full-button" type="submit">Unlock Dashboard</button>
          <p id="login-status" class="form-status" role="alert" aria-live="polite"></p>
        </form>
      </section>
    </main>
  </body>
</html>
