services:
  portfolio:
    build: .
    image: karthickcjx/portfolio
    container_name: portfolio
    ports:
      - "80:3000"
    volumes:
      - portfolio-content:/app/data
      - portfolio-assets:/app/public/assets
    environment:
      NODE_ENV: production
      PORT: 3000
      TRUST_PROXY: ${TRUST_PROXY:-0}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME in .env}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Set ADMIN_PASSWORD_HASH in .env}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}

volumes:
  portfolio-content: {}
  portfolio-assets: {}
